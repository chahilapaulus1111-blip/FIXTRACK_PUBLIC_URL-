# Free Flask hosting; provide a Neon PostgreSQL URL in Render.
services:
  - type: web
    name: fixtrack-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FIXTRACK_SETUP_TOKEN
        generateValue: true
      - key: FIXTRACK_REQUIRE_POSTGRES
        value: "1"
      - key: FIXTRACK_COOKIE_SECURE
        value: "1"
