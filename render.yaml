databases:
  - name: fixtrack-db
    databaseName: fixtrack
    user: fixtrack
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: fixtrack-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/setup-status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixtrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIXTRACK_COOKIE_SECURE
        value: "1"
